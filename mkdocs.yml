site_name: MEINE WEBSITE
site_url: https://mydomain.org/mysite
theme:
  name: material
  palette:
    # Palette toggle for dark mode (Jetzt als ERSTES -> Standard)
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Palette toggle for light mode (Jetzt als ZWEITES)
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search
  - blog
  - tags:
      tags_file: tags.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - About:
      - About Me: about/about.md
      #      - Mein Portfolio: about/README.md
      - seite: about/seite.md
  - Blog: blog/index.md
  - Tags: tags.md
